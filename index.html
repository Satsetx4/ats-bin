<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Detektif Cilik Membaca: Ide Pokok & Memahami Isi Bacaan | Kelas 3 SD</title>
  <meta name="description" content="Aplikasi pembelajaran interaktif Bahasa Indonesia Kelas 3 SD materi Ide Pokok, Kalimat Utama, Kalimat Penjelas, dan 5W1H ADiKSiMBa.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f59e0b' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='8'/><path d='m21 21-4.3-4.3'/></svg>">

  <!-- Anti-FOUC Script for Dark / Light Theme -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('ats_theme');
        var theme = saved ? JSON.parse(saved) : null;
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (!theme && prefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="bg-amber-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased selection:bg-amber-400 selection:text-amber-950">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
